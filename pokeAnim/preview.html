<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pokeAnim 全スプライト&amp;アニメ</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #12182c;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f3f5ff;
    --muted: #9aa3c4;
    --accent: #ffcb05;
    --ok: #7dffb0;
    --bad: #ff5a4e;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: grid; grid-template-columns: 300px 1fr; height: 100vh; overflow: hidden; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; min-height: 0; background: #0e1428; }
  main { height: 100vh; min-height: 0; overflow: auto; }
  .side-head { padding: 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: 0.04em; }
  h1 b { color: var(--accent); }
  .sub { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  input[type="search"], select {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #0b1020; color: var(--text); font: inherit;
  }
  #list { overflow: auto; flex: 1; }
  .item {
    display: block; width: 100%; text-align: left; padding: 8px 14px;
    border: 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    background: transparent; color: var(--text); font: 12px var(--font); cursor: pointer;
  }
  .item .jp { display: block; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
  .item small { display: block; color: var(--muted); }
  .item.on { background: rgba(255, 203, 5, 0.12); color: var(--accent); }
  main { min-width: 0; display: flex; flex-direction: column; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .bar h2 { margin: 0 8px 0 0; font-size: 18px; }
  button, .chip {
    font: 12px var(--font); color: var(--text); background: #1a2240;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button.on, .chip.on { background: var(--accent); color: #141826; border-color: var(--accent); font-weight: 700; }
  .help, .meta { color: var(--muted); font-size: 12px; }
  label.help { display: inline-flex; gap: 6px; align-items: center; }
  .speed { width: auto; padding: 6px 8px; }
  .checker {
    background:
      linear-gradient(rgba(255,203,5,0.45), rgba(255,203,5,0.45)) center 80% / 36px 1px no-repeat,
      repeating-conic-gradient(#141b30 0% 25%, #10172a 0% 50%) 0 0 / 16px 16px;
  }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px; padding: 12px 16px;
  }
  .card {
    text-align: left; padding: 8px; border-radius: 12px;
    border: 1px solid var(--line); background: #0e1428; color: inherit; font: inherit; cursor: pointer;
  }
  .card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .card header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .card strong { font-size: 13px; }
  .card .tag { font-size: 11px; color: var(--muted); }
  .badge { font-size: 11px; }
  .badge.ok { color: var(--ok); }
  .badge.bad { color: var(--bad); }
  .card canvas, #stage, .face canvas, #strip canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100%; height: auto; border-radius: 8px; display: block;
  }
  #detail { padding: 0 16px 20px; }
  #stage { width: min(100%, 760px); height: auto; border: 1px solid var(--line); border-radius: 12px; }
  #faces { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .face { padding: 4px; border-radius: 8px; border: 1px solid var(--line); background: #0e1428; color: inherit; font: inherit; cursor: pointer; }
  .face.on { border-color: var(--accent); }
  .face span { display: block; text-align: center; font-size: 11px; margin-bottom: 4px; }
  #strip {
    display: flex; gap: 4px; overflow-x: auto; padding: 10px 0 4px;
  }
  #strip canvas { width: auto; height: 88px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
  #strip canvas.on { border-color: var(--accent); }
  #strip canvas.hit { outline: 1px dashed rgba(255, 203, 5, 0.7); }
  #diag { color: var(--muted); font-size: 12px; line-height: 1.6; min-height: 2.4em; }
  #diag .ok { color: var(--ok); }
  #diag .bad { color: var(--bad); }
  #sprites {
    display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; align-items: start;
    padding: 10px 16px 12px; border-bottom: 1px solid var(--line);
  }
  #sprite-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  #sprite-head h3 { margin: 0; font-size: 14px; letter-spacing: 0.04em; }
  #sprite-head h3 b { color: var(--accent); }
  #sprite-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .scard {
    text-align: left; padding: 6px; border-radius: 10px;
    border: 1px solid var(--line); background: #0e1428; color: inherit; font: inherit; cursor: pointer;
  }
  .scard.is-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .scard strong { display: block; font-size: 12px; margin-bottom: 4px; }
  .pixels {
    display: grid; place-items: center; min-height: 88px; border-radius: 8px;
    background: repeating-conic-gradient(#141b30 0% 25%, #10172a 0% 50%) 0 0 / 12px 12px;
  }
  .scard img, #sprite-focus img {
    image-rendering: pixelated; image-rendering: crisp-edges;
    max-width: 100%; max-height: 96px; width: auto; height: auto; display: block;
  }
  #sprite-focus {
    min-width: 0; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: #0e1428;
    display: flex; flex-direction: column; gap: 6px;
  }
  #sprite-focus:empty { display: none; }
  #sprite-focus .pixels { min-height: 220px; flex: 1; }
  #sprite-focus img { max-height: 240px; }
  #sprite-focus code { color: var(--muted); font-size: 11px; line-height: 1.45; word-break: break-all; }
  .empty { padding: 24px 14px; color: var(--muted); }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: 42vh minmax(0, 1fr); }
    aside { height: 42vh; min-height: 0; }
    main { height: auto; }
    #faces { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #sprites { grid-template-columns: 1fr; }
    #sprite-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<aside>
  <div class="side-head">
    <h1>poke<b>Anim</b> 全スプライト&amp;アニメ</h1>
    <p class="sub" id="catalog">マニフェストを読み込み中…</p>
    <input id="q" type="search" placeholder="番号・名前（例: 0006 / リザードン / charizard）" autocomplete="off">
  </div>
  <div id="list"></div>
</aside>
<main>
  <div class="bar">
    <h2 id="title">読み込み中…</h2>
    <span class="help" id="count"></span>
    <button id="prev" type="button">前のポケモン</button>
    <button id="next" type="button">次のポケモン</button>
    <button id="pause" type="button">一時停止</button>
    <select id="speed" class="speed" aria-label="再生速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="reload" type="button">シートを再読込</button>
    <label class="help"><input id="spin" type="checkbox"> 向きを自動で回す</label>
  </div>
  <div class="bar" id="dirs"></div>
  <section id="sprites">
    <div>
      <div id="sprite-head">
        <h3>poke<b>Sprite</b></h3>
        <span class="help" id="sprite-meta">読み込み中…</span>
      </div>
      <div id="sprite-grid"></div>
    </div>
    <div id="sprite-focus"></div>
  </section>
  <div id="grid"></div>
  <div id="detail">
    <canvas id="stage" class="checker" width="760" height="420"></canvas>
    <div id="faces"></div>
    <div id="strip"></div>
    <div id="diag"></div>
  </div>
</main>
<script src="manifest.js?v=20261022p"></script>
<script src="../pokeSprite/manifest.js"></script>
<script>
"use strict";
const ANIM = window.POKE_ANIM;
const SPRITE = window.POKE_SPRITE_MANIFEST;
if (!ANIM || !ANIM.pokemon) {
  document.body.innerHTML = "<p class='empty'>pokeAnim/manifest.js を読めませんでした。</p>";
  throw new Error("POKE_ANIM missing");
}

const DIRS = ANIM.dirs;
const DIR_JP = { S: "南", SE: "南東", E: "東", NE: "北東", N: "北", NW: "北西", W: "西", SW: "南西" };
const ANIM_JP = {
  Idle: "待機", Walk: "歩き", Attack: "攻撃", Shoot: "撃ち", SpAttack: "特攻",
  Strike: "打撃", Charge: "溜め", Hurt: "ダメージ", Faint: "ひんし",
};
const ANIM_ORDER = Object.keys(ANIM_JP);
const SPRITE_ORDER = ["frontPng", "frontGif", "frontReverseGif", "backPng", "backGif", "backReverseGif"];
const SPRITE_JP = {
  frontPng: "正面 PNG", frontGif: "正面 GIF", frontReverseGif: "正面 色違い",
  backPng: "背面 PNG", backGif: "背面 GIF", backReverseGif: "背面 色違い",
};
const KIND_JP = { normal: "通常", mega: "メガ", gigantamax: "キョダイ", regional: "リージョン" };
const spriteByDex = new Map();
if (SPRITE && SPRITE.pokemon) {
  for (const mon of Object.values(SPRITE.pokemon)) {
    const dex = String(mon.dex).padStart(4, "0");
    const forms = [];
    const add = (form) => { if (form && form.images) forms.push({ mon, form }); };
    add(mon.forms.normal);
    for (const kind of ["mega", "gigantamax", "regional"]) {
      for (const form of Object.values(mon.forms[kind] || {})) add(form);
    }
    spriteByDex.set(dex, forms);
  }
}
function spriteFor(id) {
  const dex = String(id || "").slice(0, 4);
  const forms = spriteByDex.get(dex) || [];
  const exact = forms.find((hit) => id === `${dex}_${hit.form.formSlug}`);
  if (exact) return exact;
  const cands = forms.filter((hit) => id.startsWith(`${dex}_${hit.form.formSlug}-`));
  cands.sort((a, b) => b.form.formSlug.length - a.form.formSlug.length);
  return cands[0] || null;
}
const ids = Object.keys(ANIM.pokemon).sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
let animTotal = 0;
for (const id of ids) animTotal += Object.keys(ANIM.pokemon[id].anims).length;

const $ = (s) => document.querySelector(s);
const stage = $("#stage");
const stageCtx = stage.getContext("2d");
const images = new Map();
let shown = ids.slice();
let index = 0;
let row = 0;
let focusName = "Idle";
let bust = "";
let paused = false;
let speed = 1;
let elapsed = 0;
let lastNow = performance.now();
let spinAcc = 0;
let spriteKey = "frontGif";
const reports = new Map();

function fileSrc(file) {
  let src = String(file).replace(/^\.\.\/pokeAnim\//, "");
  if (bust) src += (src.includes("?") ? "&" : "?") + "r=" + bust;
  return src;
}

function loadImage(file) {
  const src = fileSrc(file);
  const hit = images.get(src);
  if (hit) return hit;
  const img = new Image();
  const rec = { img, ready: false, error: false, src };
  rec.done = new Promise((resolve) => {
    img.onload = () => { rec.ready = true; resolve(rec); };
    img.onerror = () => { rec.error = true; resolve(rec); };
  });
  img.src = src;
  images.set(src, rec);
  return rec;
}

function entry() { return shown.length ? ANIM.pokemon[shown[index]] : null; }
function currentId() { return shown[index] || ""; }

function animNames(ent) {
  return Object.keys(ent.anims).sort((a, b) => {
    const ia = ANIM_ORDER.indexOf(a);
    const ib = ANIM_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
}

function label(name) { return `${ANIM_JP[name] || name} ${name}`; }

function frameIndex(anim, seconds) {
  const total = anim.durations.reduce((sum, d) => sum + d, 0) / 60 || 1;
  let t = ((seconds % total) + total) % total;
  let acc = 0;
  for (let i = 0; i < anim.durations.length; i++) {
    acc += anim.durations[i] / 60;
    if (t < acc) return i;
  }
  return anim.durations.length - 1;
}

function footOf(ent) {
  const idle = ent.anims.Idle || ent.anims[animNames(ent)[0]];
  return idle.anchorY - idle.fh / 2;
}

function place(w, h, anim, foot) {
  const ay = anim.fh / 2 + foot;
  const ground = h * 0.8;
  const above = Math.max(8, ground - 4);
  const below = Math.max(6, h - ground - 2);
  const sx = (w * 0.9) / anim.fw;
  const sy = Math.min(above / Math.max(1, ay), below / Math.max(1, anim.fh - ay));
  let scale = Math.min(sx, sy);
  if (scale >= 2) scale = Math.floor(scale);
  else scale = Math.max(0.2, scale);
  return { scale, ground: Math.round(ground), ay };
}

function drawSprite(ctx, w, h, img, anim, foot, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const { scale, ground, ay } = place(w, h, anim, foot);
  const dw = anim.fw * scale;
  const dh = anim.fh * scale;
  const dx = Math.round(w / 2 - dw / 2);
  const dy = Math.round(ground - ay * scale);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.beginPath();
  ctx.ellipse(w / 2, ground, Math.max(10, dw * 0.28), Math.max(4, h * 0.025), 0, 0, Math.PI * 2);
  ctx.fill();
  if (img) ctx.drawImage(img, frame * anim.fw, row * anim.fh, anim.fw, anim.fh, dx, dy, dw, dh);
}

function drawSpriteRow(ctx, w, h, img, anim, foot, frame, face) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const { scale, ground, ay } = place(w, h, anim, foot);
  const dw = anim.fw * scale;
  const dh = anim.fh * scale;
  const dx = Math.round(w / 2 - dw / 2);
  const dy = Math.round(ground - ay * scale);
  ctx.imageSmoothingEnabled = false;
  if (img) ctx.drawImage(img, frame * anim.fw, face * anim.fh, anim.fw, anim.fh, dx, dy, dw, dh);
}

const JP = new Map();

function fold(text) {
  return String(text || "").toLowerCase().replace(/[\u3041-\u3096]/g, (ch) =>
    String.fromCharCode(ch.charCodeAt(0) + 0x60));
}

function jpOf(id) {
  return JP.get(id) || "";
}

function monsterTitle(id) {
  const ja = jpOf(id);
  return ja ? `${id}_${ja}` : id;
}

function matchesQuery(pid, q) {
  if (!q) return true;
  return fold(monsterTitle(pid)).includes(q);
}

async function loadNames() {
  try {
    const res = await fetch("../pokeData/index.json");
    if (!res.ok) return;
    const data = await res.json();
    for (const mon of data.pokemon || []) {
      if (mon && mon.id && mon.jpName) JP.set(mon.id, mon.jpName);
    }
  } catch (err) {
    console.warn(err);
  }
}

function renderList() {
  const box = $("#list");
  if (!shown.length) {
    box.innerHTML = "<p class='empty'>該当するポケモンがありません。</p>";
    $("#count").textContent = "0 / 0";
    return;
  }
  const frag = document.createDocumentFragment();
  shown.forEach((pid, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item" + (i === index ? " on" : "");
    b.dataset.i = String(i);
    const n = Object.keys(ANIM.pokemon[pid].anims).length;
    const name = document.createElement("span");
    name.className = "jp";
    name.textContent = monsterTitle(pid);
    const small = document.createElement("small");
    small.textContent = `${n} アニメ`;
    b.append(name, small);
    frag.appendChild(b);
  });
  box.replaceChildren(frag);
  const on = box.querySelector(".on");
  if (on) on.scrollIntoView({ block: "nearest" });
  $("#count").textContent = `${index + 1} / ${shown.length}`;
}

function paintSelection() {
  const nodes = $("#list").querySelectorAll(".item");
  nodes.forEach((node, i) => node.classList.toggle("on", i === index));
  const on = $("#list").querySelector(".item.on");
  if (on) on.scrollIntoView({ block: "nearest" });
  $("#count").textContent = shown.length ? `${index + 1} / ${shown.length}` : "0 / 0";
}

function buildDirs() {
  const box = $("#dirs");
  box.replaceChildren();
  DIRS.forEach((dir, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.row = String(i);
    b.textContent = `${DIR_JP[dir] || dir} ${dir}`;
    b.className = i === row ? "on" : "";
    box.appendChild(b);
  });
}

function select(i, keepTime) {
  if (!shown.length) return;
  index = (i + shown.length) % shown.length;
  const ent = entry();
  const names = animNames(ent);
  if (!ent.anims[focusName]) focusName = ent.anims.Idle ? "Idle" : names[0];
  if (!keepTime) elapsed = 0;
  const hash = `${currentId()}/${focusName}`;
  history.replaceState(null, "", `#${encodeURIComponent(currentId())}/${encodeURIComponent(focusName)}`);
  $("#title").textContent = monsterTitle(currentId());
  paintSelection();
  buildGrid();
  buildDirs();
  buildSprites();
  inspectCurrent();
}

function buildGrid() {
  const ent = entry();
  const grid = $("#grid");
  grid.replaceChildren();
  if (!ent) return;
  const foot = footOf(ent);
  for (const name of animNames(ent)) {
    const anim = ent.anims[name];
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card" + (name === focusName ? " on" : "");
    card.dataset.anim = name;
    const header = document.createElement("header");
    const title = document.createElement("strong");
    title.textContent = label(name);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = `${anim.frames}コマ ${anim.fw}×${anim.fh}`;
    header.append(title, tag);
    const canvas = document.createElement("canvas");
    canvas.className = "checker";
    canvas.width = 260;
    canvas.height = 180;
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.dataset.badge = name;
    badge.textContent = "確認中…";
    card.append(header, canvas, badge);
    card._draw = () => {
      const rec = loadImage(anim.file);
      const ctx = canvas.getContext("2d");
      if (!rec.ready) return;
      drawSprite(ctx, canvas.width, canvas.height, rec.img, anim, foot, frameIndex(anim, elapsed));
    };
    grid.appendChild(card);
  }
}

function buildSprites() {
  const grid = $("#sprite-grid");
  const meta = $("#sprite-meta");
  const focus = $("#sprite-focus");
  grid.replaceChildren();
  focus.replaceChildren();
  const id = currentId();
  if (!SPRITE || !SPRITE.pokemon) {
    meta.textContent = "pokeSprite/manifest.js を読めませんでした。";
    return;
  }
  const hit = id ? spriteFor(id) : null;
  if (!hit) {
    meta.textContent = id ? `${monsterTitle(id)} に対応するフォームがありません。` : "ポケモンを選ぶとスプライトを表示します。";
    return;
  }
  const { mon, form } = hit;
  meta.textContent = `${monsterTitle(id)}　${KIND_JP[form.kind] || form.kind}　第${mon.generation}世代　${mon.folder}`;
  if (!form.images[spriteKey]) spriteKey = "frontGif";
  for (const key of SPRITE_ORDER) {
    const file = form.images[key];
    const card = document.createElement("button");
    card.type = "button";
    card.className = "scard" + (key === spriteKey ? " is-on" : "");
    card.dataset.key = key;
    const title = document.createElement("strong");
    title.textContent = SPRITE_JP[key] || key;
    const frame = document.createElement("div");
    frame.className = "pixels";
    const size = document.createElement("span");
    size.className = "tag";
    if (!file) {
      size.className = "badge bad";
      size.textContent = "パスなし";
    } else {
      const img = document.createElement("img");
      img.alt = SPRITE_JP[key] || key;
      img.src = fileSrc(file);
      size.textContent = "読込中…";
      img.onload = () => {
        size.className = "badge ok";
        size.textContent = `${img.naturalWidth}×${img.naturalHeight}`;
        if (key === spriteKey) paintSpriteFocus(hit);
      };
      img.onerror = () => {
        size.className = "badge bad";
        size.textContent = "画像なし";
      };
      frame.appendChild(img);
    }
    card.append(title, frame, size);
    grid.appendChild(card);
  }
  paintSpriteFocus(hit);
}

function paintSpriteFocus(hit) {
  const box = $("#sprite-focus");
  box.replaceChildren();
  if (!hit) return;
  const file = hit.form.images[spriteKey];
  const label = document.createElement("strong");
  label.textContent = SPRITE_JP[spriteKey] || spriteKey;
  const frame = document.createElement("div");
  frame.className = "pixels";
  if (file) {
    const img = document.createElement("img");
    img.alt = label.textContent;
    img.src = fileSrc(file);
    frame.appendChild(img);
  }
  const path = document.createElement("code");
  path.textContent = file || "パスなし";
  box.append(label, frame, path);
}

function focusedAnim() {
  const ent = entry();
  if (!ent) return null;
  return ent.anims[focusName] || ent.anims.Idle;
}

function buildFaces() {
  const ent = entry();
  const anim = focusedAnim();
  const box = $("#faces");
  box.replaceChildren();
  if (!ent || !anim) return;
  const foot = footOf(ent);
  DIRS.forEach((dir, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "face" + (i === row ? " on" : "");
    b.dataset.row = String(i);
    const span = document.createElement("span");
    span.textContent = `${DIR_JP[dir] || dir} ${dir}`;
    const canvas = document.createElement("canvas");
    canvas.className = "checker";
    canvas.width = 120;
    canvas.height = 96;
    b.append(span, canvas);
    b._draw = () => {
      const rec = loadImage(anim.file);
      if (!rec.ready) return;
      drawSpriteRow(canvas.getContext("2d"), canvas.width, canvas.height, rec.img, anim, foot, frameIndex(anim, elapsed), i);
    };
    box.appendChild(b);
  });
}

let stripKey = "";
function buildStrip() {
  const anim = focusedAnim();
  const box = $("#strip");
  const rec = anim ? loadImage(anim.file) : null;
  const key = anim && rec && rec.ready ? `${currentId()}|${focusName}|${row}|${rec.src}` : "";
  if (key === stripKey) return;
  stripKey = key;
  box.replaceChildren();
  if (!anim || !rec || !rec.ready) return;
  const scale = Math.max(1, Math.min(3, Math.floor(96 / anim.fh)));
  for (let i = 0; i < anim.frames; i++) {
    const c = document.createElement("canvas");
    c.width = anim.fw * scale;
    c.height = anim.fh * scale;
    c.className = "checker" + (anim.hit === i ? " hit" : "");
    c.dataset.frame = String(i);
    c.title = `${i + 1} / ${anim.frames}`;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(rec.img, i * anim.fw, row * anim.fh, anim.fw, anim.fh, 0, 0, c.width, c.height);
    box.appendChild(c);
  }
}

function markStrip() {
  const anim = focusedAnim();
  if (!anim) return;
  const fi = frameIndex(anim, elapsed);
  $("#strip").querySelectorAll("canvas").forEach((c) => c.classList.toggle("on", Number(c.dataset.frame) === fi));
}

function seekFrame(i) {
  const anim = focusedAnim();
  if (!anim) return;
  paused = true;
  $("#pause").textContent = "再生";
  let ticks = 0;
  for (let k = 0; k < i; k++) ticks += anim.durations[k] || 0;
  elapsed = ticks / 60 + 1 / 120;
  $("#spin").checked = false;
}

async function inspectOne(name) {
  const ent = entry();
  const anim = ent && ent.anims[name];
  const badge = document.querySelector(`[data-badge="${CSS.escape(name)}"]`);
  if (!anim) return null;
  const rec = await loadImage(anim.file).done;
  if (rec.error) {
    const report = { name, error: true };
    reports.set(`${currentId()}|${name}|${row}`, report);
    if (badge) { badge.className = "badge bad"; badge.textContent = "画像なし"; }
    return report;
  }
  const ew = anim.fw * anim.frames;
  const eh = anim.fh * anim.rows;
  const sizeOk = rec.img.naturalWidth === ew && rec.img.naturalHeight === eh;
  let empty = 0;
  const c = document.createElement("canvas");
  c.width = anim.fw;
  c.height = anim.fh;
  const g = c.getContext("2d", { willReadFrequently: true });
  for (let i = 0; i < anim.frames; i++) {
    g.clearRect(0, 0, anim.fw, anim.fh);
    g.drawImage(rec.img, i * anim.fw, row * anim.fh, anim.fw, anim.fh, 0, 0, anim.fw, anim.fh);
    const px = g.getImageData(0, 0, anim.fw, anim.fh).data;
    let seen = false;
    for (let p = 3; p < px.length; p += 16) if (px[p]) { seen = true; break; }
    if (!seen) {
      for (let p = 3; p < px.length; p += 4) if (px[p]) { seen = true; break; }
    }
    if (!seen) empty++;
  }
  const report = {
    name, sizeOk, empty, frames: anim.frames,
    imgW: rec.img.naturalWidth, imgH: rec.img.naturalHeight, ew, eh,
  };
  reports.set(`${currentId()}|${name}|${row}`, report);
  if (badge && currentId()) {
    badge.className = "badge " + (sizeOk && !empty ? "ok" : "bad");
    badge.textContent = !sizeOk ? "サイズ不一致" : empty ? `空コマ ${empty}` : "サイズ一致";
  }
  return report;
}

let inspectToken = 0;
function inspectCurrent() {
  const token = ++inspectToken;
  const id = currentId();
  const names = entry() ? animNames(entry()) : [];
  buildFaces();
  stripKey = "";
  buildStrip();
  Promise.all(names.map((name) => inspectOne(name))).then(() => {
    if (token !== inspectToken || id !== currentId()) return;
    writeDiag();
    buildStrip();
  });
}

function writeDiag() {
  const anim = focusedAnim();
  const el = $("#diag");
  if (!anim) { el.textContent = ""; return; }
  const report = reports.get(`${currentId()}|${focusName}|${row}`);
  const secs = anim.durations.reduce((s, d) => s + d, 0) / 60;
  const hit = anim.hit == null ? "なし" : `${anim.hit + 1}コマ目`;
  let health = "シートを読み込み中…";
  if (report && report.error) health = `<span class="bad">画像を読めません ${anim.file}</span>`;
  else if (report) {
    const sizeMsg = report.sizeOk
      ? `<span class="ok">サイズ一致 ${report.ew}×${report.eh}</span>`
      : `<span class="bad">サイズ不一致 画像 ${report.imgW}×${report.imgH} / マニフェスト ${report.ew}×${report.eh}</span>`;
    const emptyMsg = report.empty
      ? `<span class="bad">${DIRS[row]} の空コマ ${report.empty}/${report.frames}</span>`
      : `<span class="ok">${DIRS[row]} に空コマなし</span>`;
    health = `${sizeMsg}　${emptyMsg}`;
  }
  el.innerHTML = `${label(focusName)}　向き ${DIR_JP[DIRS[row]]} ${DIRS[row]}　${anim.frames}コマ　1周 ${secs.toFixed(2)}秒　ヒット ${hit}　${health}`
    + `<div class="help">↑↓ でポケモン　←→ で向き　Space で停止　コマをクリックするとそのコマで止まる　R で再読込</div>`;
}

function draw(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  if (!paused) {
    elapsed += dt * speed;
    if ($("#spin").checked) {
      spinAcc += dt;
      if (spinAcc >= 0.9) {
        spinAcc = 0;
        row = (row + 1) % DIRS.length;
        buildDirs();
        $("#faces").querySelectorAll(".face").forEach((el, i) => el.classList.toggle("on", i === row));
        stripKey = "";
        inspectCurrent();
      }
    }
  }
  const ent = entry();
  const anim = focusedAnim();
  if (ent && anim) {
    document.querySelectorAll("#grid .card").forEach((card) => card._draw && card._draw());
    document.querySelectorAll("#faces .face").forEach((face) => face._draw && face._draw());
    const rec = loadImage(anim.file);
    if (rec.ready) drawSprite(stageCtx, stage.width, stage.height, rec.img, anim, footOf(ent), frameIndex(anim, elapsed));
    buildStrip();
    markStrip();
  }
  requestAnimationFrame(draw);
}

function reloadImages() {
  bust = String(Date.now());
  images.clear();
  reports.clear();
  stripKey = "";
  buildGrid();
  buildSprites();
  inspectCurrent();
}

function setRow(next) {
  row = (next + DIRS.length) % DIRS.length;
  buildDirs();
  $("#faces").querySelectorAll(".face").forEach((el, i) => el.classList.toggle("on", i === row));
  stripKey = "";
  inspectCurrent();
}

function setFocus(name) {
  if (!entry() || !entry().anims[name]) return;
  focusName = name;
  $("#grid").querySelectorAll(".card").forEach((card) => card.classList.toggle("on", card.dataset.anim === name));
  history.replaceState(null, "", `#${encodeURIComponent(currentId())}/${encodeURIComponent(focusName)}`);
  stripKey = "";
  buildFaces();
  inspectCurrent();
}

$("#catalog").textContent = `${ids.length} 体　${animTotal} アニメ　8 方向　manifest v${ANIM.version ?? "?"}`
  + (SPRITE && SPRITE.counts ? `　スプライト ${SPRITE.counts.pokemonImages} 画像` : "　pokeSprite なし");
$("#list").addEventListener("click", (e) => {
  const b = e.target.closest(".item");
  if (!b) return;
  select(Number(b.dataset.i), false);
});
$("#dirs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  setRow(Number(b.dataset.row));
});
$("#grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) setFocus(card.dataset.anim);
});
$("#sprite-grid").addEventListener("click", (e) => {
  const card = e.target.closest(".scard");
  if (!card || !entry()) return;
  spriteKey = card.dataset.key;
  $("#sprite-grid").querySelectorAll(".scard").forEach((el) => el.classList.toggle("is-on", el === card));
  paintSpriteFocus(spriteFor(currentId()));
});
$("#faces").addEventListener("click", (e) => {
  const b = e.target.closest(".face");
  if (b) setRow(Number(b.dataset.row));
});
$("#strip").addEventListener("click", (e) => {
  const c = e.target.closest("canvas");
  if (c) seekFrame(Number(c.dataset.frame));
});
$("#q").addEventListener("input", () => {
  const q = fold($("#q").value.trim());
  const cur = currentId();
  shown = ids.filter((pid) => matchesQuery(pid, q));
  const keep = shown.indexOf(cur);
  index = keep >= 0 ? keep : 0;
  renderList();
  if (shown.length) select(index, true);
  else {
    $("#title").textContent = "該当なし";
    $("#grid").replaceChildren();
    $("#faces").replaceChildren();
    $("#strip").replaceChildren();
    $("#diag").textContent = "";
    buildSprites();
  }
});
$("#prev").addEventListener("click", () => select(index - 1, false));
$("#next").addEventListener("click", () => select(index + 1, false));
$("#pause").addEventListener("click", () => {
  paused = !paused;
  $("#pause").textContent = paused ? "再生" : "一時停止";
});
$("#speed").addEventListener("change", (e) => { speed = Number(e.target.value) || 1; });
$("#reload").addEventListener("click", reloadImages);
addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowDown") { select(index + 1, false); e.preventDefault(); }
  if (e.key === "ArrowUp") { select(index - 1, false); e.preventDefault(); }
  if (e.key === "ArrowRight") { setRow(row + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft") { setRow(row - 1); e.preventDefault(); }
  if (e.key === " ") {
    paused = !paused;
    $("#pause").textContent = paused ? "再生" : "一時停止";
    e.preventDefault();
  }
  if (e.key === "r" || e.key === "R") reloadImages();
});

loadNames().finally(() => {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [hashId, hashAnim] = hash.split("/");
  const q = fold($("#q").value.trim());
  if (q) shown = ids.filter((pid) => matchesQuery(pid, q));
  renderList();
  buildDirs();
  const startAt = hashId ? shown.indexOf(hashId) : 0;
  if (hashAnim) focusName = hashAnim;
  if (shown.length) select(startAt >= 0 ? startAt : 0, false);
  document.body.dataset.ready = "1";
  requestAnimationFrame(draw);
});
</script>
</body>
</html>
