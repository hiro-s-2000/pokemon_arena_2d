$('title').textContent=D.project.id+' / SpriteCollab '+D.project.source.folder;
for(const n of Object.keys(D.record.anims)){$('anim').add(new Option(n,n));images[n]=new Image();images[n].src=D.images[n];refs[n]=new Image();refs[n].src=D.reference[n];}
for(const[side,src]of Object.entries(D.design)){const im=new Image();im.src=src;im.alt='pokeSprite '+side;$('design').append(im);}
for(let r=0;r<8;r++){const box=document.createElement('div');box.className='pair';const label=document.createElement('small');label.textContent=D.project.dirs[r]+' — 元の絵 / 編集結果';const c=document.createElement('canvas');box.append(label,c);$('views').append(box);canvases.push(c);}
$('checks').textContent='構造検査: 合格 / 画質は目視確認が必要\n'+D.warnings.join('\n');
let elapsed=0,playing=true,last=performance.now();
function frame(a){let t=elapsed%(a.durations.reduce((s,d)=>s+d,0)/60);for(let i=0;i<a.frames;i++){t-=a.durations[i]/60;if(t<0)return i;}return a.frames-1;}
function render(){const n=$('anim').value,a=D.record.anims[n],raw=D.project.anims[n],f=frame(a),z=+$('zoom').value;
  $('status').textContent=`コマ ${f+1}/${a.frames} ・ ${a.durations[f]} ticks ・ ヒット ${a.hit===null?'なし':a.hit+1} ・ 変更 ${D.metrics[n].changedPixels??'寸法変更'} px`;
  canvases.forEach((c,r)=>{const w=Math.max(a.fw,120),h=Math.max(a.fh,120);c.width=w*z*2;c.height=h*z;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,c.width,c.height);
    function draw(img,fw,fh,k,half,alpha){if(!img.complete||!img.naturalWidth)return;ctx.globalAlpha=alpha;const row=a.rows===1?0:r;const scale=half===0?D.project.scale:1;ctx.drawImage(img,k*fw,row*fh,fw,fh,(half*w+(w-fw*scale)/2)*z,(h-fh*scale)/2*z,fw*scale*z,fh*scale*z);ctx.globalAlpha=1;}
    if($('onion').checked){draw(refs[n],raw.fw,raw.fh,(f+a.frames-1)%a.frames,0,.25);draw(images[n],a.fw,a.fh,(f+a.frames-1)%a.frames,1,.25);}
    draw(refs[n],raw.fw,raw.fh,f,0,1);draw(images[n],a.fw,a.fh,f,1,1);
  });
}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'停止':'再生';};
function step(d){playing=false;$('play').textContent='再生';const a=D.record.anims[$('anim').value],i=(frame(a)+d+a.frames)%a.frames;elapsed=a.durations.slice(0,i).reduce((s,x)=>s+x,0)/60+.000001;render();}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('anim').onchange=()=>{elapsed=0;render();};
function tick(now){if(playing)elapsed+=(now-last)/1000*+$('speed').value;last=now;render();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
